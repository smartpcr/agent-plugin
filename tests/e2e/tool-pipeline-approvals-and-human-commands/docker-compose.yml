# Phase "tool pipeline, approvals and human commands" compose path (non-gating):
# the tools, human and agent package tests and the godog E2E against a dsh-home
# named volume. The gate path needs none of this -- TC-10a runs in-process on the
# test kit and DH-T-TOOLS-14 compares against the committed golden
# internal/tools/testdata/prompt.golden; DSH_E2E_STORE_HOME unset selects the
# embedded store under a test-kit temp home.
#
#   docker compose -f tests/e2e/tool-pipeline-approvals-and-human-commands/docker-compose.yml run --rm dsh-home-init
#   docker compose -f tests/e2e/tool-pipeline-approvals-and-human-commands/docker-compose.yml run --rm harness-store-tests
#   docker compose -f tests/e2e/tool-pipeline-approvals-and-human-commands/docker-compose.yml down -v
name: dsh-tool-pipeline-e2e

volumes:
  dsh-home: {}
  go-cache: {}

services:
  dsh-home-init:
    image: golang:1.27
    user: "0:0"
    volumes:
      - dsh-home:/dsh-home
    command: ["sh", "-c", "chown 0:0 /dsh-home && chmod 0700 /dsh-home && ls -ld /dsh-home"]

  harness-store-tests:
    image: golang:1.27
    depends_on:
      dsh-home-init:
        condition: service_completed_successfully
    working_dir: /repo
    environment:
      GOWORK: "off"
      CGO_ENABLED: "1"
      GOFLAGS: "-mod=readonly"
      DSH_E2E_STORE_HOME: /dsh-home
      DSH_HOME: ""
    volumes:
      - ../../..:/repo:ro
      - dsh-home:/dsh-home
      - go-cache:/root/.cache
    command:
      - sh
      - -c
      - >-
        go -C src/harness test -race -count=1 ./internal/tools/... ./internal/human/... ./internal/agent/... &&
        go -C src/harness test -tags e2e -count=1 -v
        -run '^TestE2E_tool_pipeline_approvals_and_human_commands_'
        ./test/e2e/harness-DSH/
