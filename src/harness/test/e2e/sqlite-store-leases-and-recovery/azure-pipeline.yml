# Stage 7.1 to 7.3 E2E (SQLite driver measurement and atomic appends; session
# leases and crash recovery; export, import, follow and store repair) on Azure Pipelines.
# Mirrors .github/workflows/e2e-sqlite-store-leases-and-recovery.yml: a gating
# job on Microsoft-hosted agents for Linux, macOS and Windows (service:sqlite is
# embedded; no DSN, no secrets) and a non-gating compose job on ubuntu-latest.
trigger:
  branches:
    include: [main]
  paths:
    include:
      - src/harness
      - tests/e2e/sqlite-store-leases-and-recovery

pr:
  paths:
    include:
      - src/harness
      - tests/e2e/sqlite-store-leases-and-recovery

variables:
  GOWORK: "off"

jobs:
  - job: e2e
    displayName: e2e ($(imageName))
    strategy:
      matrix:
        linux:
          imageName: ubuntu-latest
        mac:
          imageName: macos-latest
        windows:
          imageName: windows-latest
    pool:
      vmImage: $(imageName)
    steps:
      - checkout: self
      - task: GoTool@0
        inputs:
          version: "1.27.4"
      - bash: go -C src/harness test -race -shuffle=on -count=1 ./internal/session/store/...
        displayName: Store tests
      - bash: go -C src/harness test -run TestBudgetStoreAppend -count=1 -v ./internal/session/store/sqlite
        displayName: Driver measurement (F-2)
      - bash: |
          set -o pipefail
          go -C src/harness test -tags e2e -count=1 -v \
            -run '^TestE2E_sqlite_store_leases_and_recovery_' \
            ./test/e2e/harness-DSH/ 2>&1 | tee e2e.log
          if grep -q -- '--- SKIP' e2e.log; then echo "a required scenario skipped"; exit 1; fi
        displayName: Godog scenarios

  - job: compose
    displayName: compose (non-gating)
    continueOnError: true
    pool:
      vmImage: ubuntu-latest
    variables:
      COMPOSE_FILE: tests/e2e/sqlite-store-leases-and-recovery/docker-compose.yml
    steps:
      - checkout: self
      - bash: docker compose run --rm dsh-home-init
        displayName: Initialise the dsh-home volume
      - bash: docker compose run --rm harness-store-tests
        displayName: Run the store tests against the volume
      - bash: docker compose down -v
        displayName: Tear down
        condition: always()
