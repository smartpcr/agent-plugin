# Stage 8.1 E2E (typed machine state and stored folds): machine state survives
# restart, and a changed stored-fold version rebuilds (TC-08). Stage 8.2 E2E
# (built-in views, projects and session listing): refold equals stored for the
# four built-in views, listing by project equals the committed golden, and a
# hidden session's agent is stopped with cause hidden (TC-08). Stage 8.3 E2E
# (spill store and attachments): a 5 MB result spilled and recoverable, a
# corrupted attachment detected, spill files private (TC-08; service:filesystem
# under t.TempDir()). service:sqlite is
# embedded (modernc.org/sqlite in the test binary), every dsh.db lives under
# t.TempDir(); no DSN, no secrets. A compose job (non-gating) runs the same
# tests against a dsh-home volume via tests/e2e/machine-state-views-and-spill.
trigger:
  branches:
    include: [main]
  paths:
    include:
      - src/harness
      - tests/e2e/machine-state-views-and-spill

pr:
  paths:
    include:
      - src/harness
      - tests/e2e/machine-state-views-and-spill

variables:
  GOWORK: "off"

jobs:
  - job: e2e
    displayName: e2e ($(imageName))
    strategy:
      matrix:
        linux:
          imageName: ubuntu-latest
        mac:
          imageName: macos-latest
        windows:
          imageName: windows-latest
    pool:
      vmImage: $(imageName)
    steps:
      - checkout: self
      - task: GoTool@0
        inputs:
          version: "1.26.0"
      - bash: go -C src/harness test -race -shuffle=on -count=1 ./internal/storage/... ./internal/session/views/...
        displayName: Machine-state and view tests
      - bash: |
          set -o pipefail
          go -C src/harness test -tags e2e -count=1 -v \
            -run '^TestE2E_machine_state_views_and_spill_' \
            ./test/e2e/harness-DSH/ 2>&1 | tee e2e.log
          if grep -q -- '--- SKIP' e2e.log; then echo "a required scenario skipped"; exit 1; fi
        displayName: Godog scenarios

  - job: compose
    displayName: compose (non-gating)
    continueOnError: true
    pool:
      vmImage: ubuntu-latest
    variables:
      COMPOSE_FILE: tests/e2e/machine-state-views-and-spill/docker-compose.yml
    steps:
      - checkout: self
      - bash: docker compose run --rm dsh-home-init
        displayName: Initialise the dsh-home volume
      - bash: docker compose run --rm harness-store-tests
        displayName: Run the store tests against the volume
      - bash: docker compose down -v
        displayName: Tear down
        condition: always()
