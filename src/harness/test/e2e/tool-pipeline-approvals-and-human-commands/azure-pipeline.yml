# Phase "tool pipeline, approvals and human commands" E2E (Stage 10.1: tool
# registry and prompt assembly; Stage 10.2: approvals and guarded pipeline) on
# Azure Pipelines. Mirrors
# .github/workflows/e2e-tool-pipeline-approvals-and-human-commands.yml: a gating
# job on Microsoft-hosted agents for Linux, macOS and Windows (in-process, golden
# and embedded-SQLite proofs; no DSN, no secrets) and a non-gating compose job on
# ubuntu-latest.
trigger:
  branches:
    include: [main]
  paths:
    include:
      - src/harness
      - tests/e2e/tool-pipeline-approvals-and-human-commands

pr:
  paths:
    include:
      - src/harness
      - tests/e2e/tool-pipeline-approvals-and-human-commands

variables:
  GOWORK: "off"

jobs:
  - job: e2e
    displayName: e2e ($(imageName))
    strategy:
      matrix:
        linux:
          imageName: ubuntu-latest
        mac:
          imageName: macos-latest
        windows:
          imageName: windows-latest
    pool:
      vmImage: $(imageName)
    steps:
      - checkout: self
      - task: GoTool@0
        inputs:
          version: "1.26.0"
      - bash: go -C src/harness test -race -shuffle=on -count=1 ./internal/tools/... ./internal/human/... ./internal/agent/...
        displayName: Tools, human and agent tests
      - bash: |
          set -o pipefail
          go -C src/harness test -tags e2e -count=1 -v \
            -run '^TestE2E_tool_pipeline_approvals_and_human_commands_' \
            ./test/e2e/harness-DSH/ 2>&1 | tee e2e.log
          if grep -q -- '--- SKIP' e2e.log; then echo "a required scenario skipped"; exit 1; fi
        displayName: Godog scenarios

  - job: compose
    displayName: compose (non-gating)
    continueOnError: true
    pool:
      vmImage: ubuntu-latest
    variables:
      COMPOSE_FILE: tests/e2e/tool-pipeline-approvals-and-human-commands/docker-compose.yml
    steps:
      - checkout: self
      - bash: docker compose run --rm dsh-home-init
        displayName: Initialise the dsh-home volume
      - bash: docker compose run --rm harness-store-tests
        displayName: Run the tests against the volume
      - bash: docker compose down -v
        displayName: Tear down
        condition: always()
