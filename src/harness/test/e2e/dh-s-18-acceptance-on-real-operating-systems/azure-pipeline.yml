# Stage 8.9 E2E (impl.md DH-S-18, durable replace under power loss;
# DH-E-NODEFS-1, TC-21s5) on Azure Pipelines. Mirrors
# .github/workflows/e2e-dh-s-18-acceptance-on-real-operating-systems.yml.
#
# Manual runs only (no trigger, no pr). The self-hosted pool dsh-hypervisor holds
# the controller that reaches the team-kept KVM/libvirt and Hyper-V hosts
# (service:vm-power-cut, service:ack-recorder). The variable group dsh-m2-s18
# declares the DSH_S18_KVM_* and DSH_S18_HYPERV_* inputs of runbook-power-cut.md
# step 2. Non-secret group variables reach the scripts as environment variables
# with the same names. The job fails if any input is unset, if either scenario
# skips, or if either scenario does not pass.
trigger: none
pr: none

variables:
  - group: dsh-m2-s18
  - name: GOWORK
    value: "off"
  - name: SUITE
    value: '^TestE2E_dh_s_18_acceptance_on_real_operating_systems_durable_replace_under_power_loss$'

jobs:
  - job: power_cut
    displayName: DH-E-NODEFS-1 (KVM Linux guest, Hyper-V Windows guest)
    timeoutInMinutes: 370
    pool:
      name: dsh-hypervisor
    steps:
      - checkout: self
      - task: GoTool@0
        inputs:
          version: "1.27.4"
      - bash: |
          missing=""
          for t in KVM HYPERV; do
            for k in NODEFS_LISTEN NODEFS_START NODEFS_POWEROFF NODEFS_POWERON NODEFS_READ \
                     BASE_IMAGES PROBE_CREATE PROBE_SHOW PROBE_ACK PROBE_DELETE; do
              n="DSH_S18_${t}_${k}"
              [ -n "${!n}" ] || missing="$missing $n"
            done
          done
          [ -z "$missing" ] || { echo "##vso[task.logissue type=error]not set in variable group dsh-m2-s18:$missing"; exit 1; }
        displayName: Inputs declared
      - bash: |
          set -o pipefail
          export DSH_E2E_NODEFS_ARTIFACTS="$(Build.ArtifactStagingDirectory)/nodefs"
          mkdir -p "$DSH_E2E_NODEFS_ARTIFACTS"
          log="$(Build.ArtifactStagingDirectory)/nodefs.txt"
          { echo "commit $(Build.SourceVersion)"; uname -a; } | tee "$log"
          go -C src/harness test -tags e2e -v -timeout 355m -run "$SUITE" ./test/e2e/harness-DSH-M2/ 2>&1 | tee -a "$log"
          if grep -q -- '--- SKIP' "$log"; then echo "a required scenario skipped"; exit 1; fi
          for s in DH-E-NODEFS-1_Linux_guest DH-E-NODEFS-1_Windows_guest; do
            grep -qF -- "--- PASS: TestE2E_dh_s_18_acceptance_on_real_operating_systems_durable_replace_under_power_loss/$s" "$log" \
              || { echo "$s did not pass"; exit 1; }
          done
        displayName: DH-E-NODEFS-1 on both guests (must run and pass)
      - task: PublishPipelineArtifact@1
        condition: always()
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)
          artifact: e2e-nodefs-power-cut
