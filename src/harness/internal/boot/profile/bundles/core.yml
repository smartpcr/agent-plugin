# core: the entries every profile starts with (DH-ADR-BOOT-2). The full content is
# DH-D-BUNDLE-1's; this layer is parsed by the YAML codec like any other layer.
- insert:
    - id: logging
      name: boot.logging
      config:
        destination: stderr
        level: info
    # Outbound data (DH-D-HOST-4): every kind is off until its own setting is on,
    # and off: true (or DSH_SHARING_OFF) denies every kind.
    - id: sharing
      name: host.sharing
      config:
        off: false
    - id: egress
      name: util.egress
