# core: the kernel every launchable profile starts with, stacked over admin.yml
# (bundle-preset.md §6.2, DH-D-BUNDLE-2). Host plane only, no model-facing entry;
# the sharing gate is in admin.yml below it, so no layer can send before it exists.
#
# The entries of components this build has. Each later deliverable that builds one
# of the others adds its entry here in the same change: the timer, session.scope
# (top level), session.core, session.checkpoint, session.views, session.workdir,
# attachments, spill store and policy, agent.registry, agent.driver (no configured
# agent), agent.default-model, tools.registry, tools.prompt, llm.runtime, llm.retry,
# llm.meter, llm.routes, llm.deepseek.api-key, human.interactions, human.approval,
# human.commands, fs.local, fs.ops, subprocess.local, sandbox.policy, jobs.registry,
# agent.presets and host.conversation.
- insert:
    # Every outbound client, the resolver and child environments (util/egress).
    - id: egress
      name: util.egress
    # File and directory watches: one service for every watcher of the host.
    - id: watch
      name: util.watch
