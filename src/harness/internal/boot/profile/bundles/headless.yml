# headless: the layer of the headless profile (bundle-preset.md §6.2, DH-D-BUNDLE-1),
# applied over core, base and presets. It mounts the one-shot runner, keeps the
# secret store to environment sources, switches the authorization entry off and
# takes the question tool out of every preset, so a job never reads, migrates or
# changes a saved key or sign-in and never waits on a person (DH-ADR-BUNDLE-9).
#
# The operations name their targets by catalogue name. Until a target's component
# is registered and its entry is in a lower bundle, the composer reports the
# operation as matching no entry and skips it; the profile does not launch before
# DH-D-BUNDLE-3 (boot's audit names the absent required entries).

# The carrier: A24's runner (C50). Required, after profile.Spine.
- insert:
    - id: cli.headless
      name: cli.headless

# One field merged where upstream restates the row: environment sources only.
- id: human.secrets
  name: human.secrets
  merge:
    backend: env

- id: human.authorization
  name: human.authorization
  disabled: true

# The question tool out of each shipped preset (DH-D-BUNDLE-4/5): a declaration is
# a top-level agent.preset entry whose children are a map, so a merge reaches one
# child and a null removes it. A preset that extends another (script, creator) also
# loses the child it would inherit, and one that never had it is unchanged.
- id: preset.standard
  name: agent.preset
  merge:
    children:
      tool.ask-user: null
- id: preset.script
  name: agent.preset
  merge:
    children:
      tool.ask-user: null
- id: preset.minimal
  name: agent.preset
  merge:
    children:
      tool.ask-user: null
- id: preset.creator
  name: agent.preset
  merge:
    children:
      tool.ask-user: null
