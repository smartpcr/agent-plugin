# Phase "agent loop milestone M1" E2E (Stage 11.1: model selection and step
# tool batch; Stage 11.2: agent driver brackets and cancellation; Stage 11.3:
# agent lifecycle and delegation seam).
#
#   e2e      the gate path: godog scenarios with -tags e2e on Linux, macOS and
#            Windows. TC-11a (DH-T-AGENT-23) runs in-process on the test kit's
#            scripted fake model and memstore, zero I/O; TC-11b (DH-T-AGENT-26)
#            runs the step's batch on the embedded SQLite store in a test-kit
#            temp home and reads the committed tool/call and tool/result order
#            back from a second connection. Stage 11.2 drives the real agent
#            driver in-process: the 500-case no-unanswered-tool-call property
#            (DH-S-11), the step cancel resuming at point 14 (DH-T-AGENT-16) and
#            the step budget (DH-T-AGENT-8). Stage 11.3 runs the registry and
#            the driver's factory: a failed create rolls back (DH-T-AGENT-19),
#            a delegated child goes with its one owner (TC-11a) and a shutdown
#            mid-step on the embedded SQLite store keeps closed brackets and
#            the last settlement (DH-T-AGENT-21, TC-11b). No DSN, no secrets,
#            DSH_E2E_STORE_HOME and DSH_DEEPSEEK_API_KEY unset.
#   compose  non-gating: the same tests against a dsh-home named volume through
#            tests/e2e/agent-loop-milestone-m1/docker-compose.yml.
#
# The M1 manual check (real model with DSH_DEEPSEEK_API_KEY) never runs in CI.
name: e2e-agent-loop-milestone-m1

on:
  pull_request:
    paths:
      - src/harness/**
      - tests/e2e/agent-loop-milestone-m1/**
      - .github/workflows/e2e-agent-loop-milestone-m1.yml
  push:
    branches: [main]
    paths:
      - src/harness/**
      - tests/e2e/agent-loop-milestone-m1/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-agent-loop-m1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/harness/go.mod
          cache-dependency-path: src/harness/go.sum
      - name: Agent, delegate, tools and llm tests
        run: go -C src/harness test -race -shuffle=on -count=1 ./internal/agent/... ./internal/delegate/... ./internal/tools/... ./internal/llm/...
      - name: Godog scenarios
        run: |
          set -o pipefail
          mkdir -p artifacts/e2e
          log=artifacts/e2e/agent-loop-m1-${{ runner.os }}.txt
          go -C src/harness test -tags e2e -count=1 -v \
            -run '^TestE2E_agent_loop_milestone_m1_' \
            ./test/e2e/harness-DSH/ 2>&1 | tee "$log"
          if grep -q -- '--- SKIP' "$log"; then echo "a required scenario skipped"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-agent-loop-m1-${{ matrix.os }}
          path: artifacts/e2e/
          if-no-files-found: warn

  compose:
    name: compose (ubuntu-latest, non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      COMPOSE_FILE: tests/e2e/agent-loop-milestone-m1/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Initialise the dsh-home volume
        run: docker compose run --rm dsh-home-init
      - name: Run the tests against the volume
        run: docker compose run --rm harness-store-tests
      - name: Tear down
        if: always()
        run: docker compose down -v
