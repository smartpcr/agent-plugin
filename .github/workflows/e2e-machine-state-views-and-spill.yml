# Stage 8.1 E2E (typed machine state and stored folds): machine state survives
# restart, and a changed stored-fold version rebuilds (TC-08). Stage 8.2 E2E
# (built-in views, projects and session listing): refold equals stored for the
# four built-in views, listing by project equals the committed golden, and a
# hidden session's agent is stopped with cause hidden (TC-08). service:sqlite is
# embedded (modernc.org/sqlite in the test binary), every dsh.db lives under
# t.TempDir(); no DSN, no secrets. A compose job (non-gating) runs the same
# tests against a dsh-home volume via tests/e2e/machine-state-views-and-spill.
name: e2e-machine-state-views-and-spill

on:
  pull_request:
    paths:
      - src/harness/**
      - tests/e2e/machine-state-views-and-spill/**
      - .github/workflows/e2e-machine-state-views-and-spill.yml
  push:
    branches: [main]
    paths:
      - src/harness/**
      - tests/e2e/machine-state-views-and-spill/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-machine-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/harness/go.mod
          cache-dependency-path: src/harness/go.sum
      - name: Machine-state and view tests
        run: go -C src/harness test -race -shuffle=on -count=1 ./internal/storage/... ./internal/session/views/...
      - name: Godog scenarios
        run: |
          set -o pipefail
          mkdir -p artifacts/e2e
          log=artifacts/e2e/machine-state-${{ runner.os }}.txt
          go -C src/harness test -tags e2e -count=1 -v \
            -run '^TestE2E_machine_state_views_and_spill_' \
            ./test/e2e/harness-DSH/ 2>&1 | tee "$log"
          if grep -q -- '--- SKIP' "$log"; then echo "a required scenario skipped"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-machine-state-${{ matrix.os }}
          path: artifacts/e2e/
          if-no-files-found: warn

  compose:
    name: compose (ubuntu-latest, non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      COMPOSE_FILE: tests/e2e/machine-state-views-and-spill/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Initialise the dsh-home volume
        run: docker compose run --rm dsh-home-init
      - name: Run the store tests against the volume
        run: docker compose run --rm harness-store-tests
      - name: Tear down
        if: always()
        run: docker compose down -v
