# Builds and tests both ports of cordis and runs the behaviour suites against each.
#
#   dotnet  src/net: style-enforced build, dotnet format check, the behavioural tests
#   go      src/go:  gofmt, go vet, go test (with the race detector on Linux)
#   e2e     test/e2e: builds the C# and Go bindings and runs every suite with each
#           (test/e2e/Invoke-E2E.ps1); results are uploaded as NUnit XML
#   harness the dsh harness quality gate (tools/harness-gate, DH-D-TOOLCHAIN-4) on
#           hosted Linux and Windows with cgo on for -race and the floor toolchain
#           of src/harness/go.mod, plus the keyless release rehearsal
#           (DH-D-TOOLCHAIN-5) on Linux; the gate output is uploaded. These hosted
#           lanes are regression signals only: under decision platforms-windows-wsl
#           (docs/stories/harness-DSH-M1/decisions.md) the evidence of record is the
#           local Windows and WSL lanes (tools/harness-gate/lanes/), and macOS is out
#           of M1 scope. No secret is used; real-model scenarios live in
#           harness-scenarios.yml.
#
# The jobs are independent and run in parallel. The Go
# binding builds against the released src/go module (its go.mod pins a version), so
# an src/go change reaches e2e only after a new src/go/vX.Y.Z tag.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs this workflow first, so nothing is published from a red commit.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  dotnet:
    name: dotnet (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/net/global.json
      - name: Build (StyleCop and code style are errors)
        run: dotnet build Cordis.slnx
      - name: Check formatting
        if: runner.os == 'Linux'
        run: dotnet format Cordis.slnx --verify-no-changes
      - name: Test
        run: dotnet run --project tests/Cordis.Tests --no-build
      - name: Sample
        run: dotnet run --project samples/Cordis.Sample --no-build

  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/go
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go/go.mod
          # src/go requires nothing (standard library only, M1-D-TOOL-4 (A)): its
          # godog suites are the nested test-only module src/go/test/e2e, which
          # "./..." here does not enter, so there is nothing to cache.
          cache: false
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-formatted:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Test (race detector)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - name: Test
        if: runner.os != 'Linux'
        run: go test -count=1 ./...
      - name: Sample
        run: go run ./cmd/cordis-sample

  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: test/e2e/bindings/dotnet/global.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: test/e2e/bindings/go/go.mod
          cache-dependency-path: test/e2e/bindings/go/go.sum
      - name: Run the suites with both bindings
        shell: pwsh
        run: ./test/e2e/Invoke-E2E.ps1 -Binding all
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.os }}
          path: artifacts/e2e/*.xml
          if-no-files-found: warn

  harness:
    name: harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # platforms-windows-wsl: hosted regression lanes; no macOS.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # -race needs cgo and a C compiler on every lane (QG-4).
      CGO_ENABLED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The floor of src/harness/go.mod (go 1.27.4): the gate fails setup on
          # any other toolchain (M1-G-TOOL-14).
          go-version-file: src/harness/go.mod
          cache-dependency-path: |
            src/harness/go.sum
            tools/harness-gate/go.sum
      - name: Provision a C compiler (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Put gcc on PATH (Windows)
        if: runner.os == 'Windows'
        run: cygpath -w '${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin' >> "$GITHUB_PATH"
      - name: Verify the C compiler
        run: |
          cc="$(go env CC)"
          echo "go env CC = $cc"
          "$cc" --version
      - name: Quality gate
        run: |
          set -o pipefail
          mkdir -p artifacts/harness
          go version | tee artifacts/harness/gate-${{ runner.os }}.txt
          GOWORK=off go -C tools/harness-gate run . --root ../.. 2>&1 | tee -a artifacts/harness/gate-${{ runner.os }}.txt
      - name: Release rehearsal (publishes nothing)
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          GOWORK=off go -C tools/harness-gate run . rehearse --root ../.. 2>&1 | tee artifacts/harness/rehearse.txt
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-gate-${{ matrix.os }}
          path: artifacts/harness/
          if-no-files-found: warn