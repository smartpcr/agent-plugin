# Harness scenarios (DH-D-TOOLCHAIN-4 part 2, QG-10).
#
# Runs only on workflow_dispatch and on a schedule -- never on pull_request or
# pull_request_target -- so fork code never reaches a scenario run. No model key
# is read: under decision models-signed-in-claude-copilot real-model checks use a
# signed-in Claude or Copilot session. Since gap-closure step 19.2.1 the preflight
# runs the sign-in check that each index entry's `credential:` names, and a hosted
# runner holds no signed-in session, so it refuses a credentialed stage here: those
# run through "harness-gate scenarios --stage" on the development host
# (M1-D-TOOL-6 (a)). The keyless gate lives in ci.yml (harness job).
#
#   preflight  derives DSH_REQUIRE_SCENARIOS from the entry of the stage being
#              accepted in test/harness/acceptance-index.yaml ("harness-gate
#              require"), then runs "harness-gate preflight": it fails when the
#              credential hook fails, when a required ID has no scenario test, or
#              when the index and the authored *_scenario_test.go files disagree
#              (DH-ADR-TOOLCHAIN-6, -12). Nothing else starts on a failed preflight.
#   scenarios  runs exactly the required scenario tests (-tags scenario) on hosted
#              Linux and Windows (platforms-windows-wsl: regression signals; no
#              macOS); a skipped or missing required test fails the run.
#   s18        stage DH-S-18 only (implementation-plan Stage 8.1), in place of the
#              two jobs above: one job per in-scope variant of
#              docs/stories/harness-DSH-M2/evidence/variants.md, on that variant's
#              runner (TestWorkflowRunsEveryInScopeVariant binds the matrix to the
#              file). Each runs "harness-gate entry", the variant's service
#              preflight, then DSH_REQUIRE_SCENARIOS from "harness-gate require
#              --stage DH-S-18 --variant <label>", the preflight and the scenarios.
#              A failed service preflight fails only that variant's job: it is
#              recorded "not run (<check> preflight failed)" and S18 stays open
#              (M2-C-2). Machine identities come from the dsh-m2-s18 environment.
#
# A scheduled run accepts no stage, so the required list is empty and only the index
# is checked.
name: harness-scenarios

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage being accepted (an entry of test/harness/acceptance-index.yaml, e.g. DH-S-18); empty requires no scenario
        required: false
        default: ""
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: harness-scenarios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: inputs.stage != 'DH-S-18'
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.preflight.outputs.count }}
      run: ${{ steps.preflight.outputs.run }}
      tests: ${{ steps.preflight.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/harness-gate/go.mod
          cache-dependency-path: tools/harness-gate/go.sum
      - name: Derive the required scenarios from the acceptance index
        id: require
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          list="$(GOWORK=off go -C tools/harness-gate run . require --root ../.. --stage "$STAGE")"
          echo "stage=${STAGE:-<none>} DSH_REQUIRE_SCENARIOS=$list"
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: Preflight
        id: preflight
        env:
          DSH_REQUIRE_SCENARIOS: ${{ steps.require.outputs.list }}
        run: GOWORK=off go -C tools/harness-gate run . preflight --root ../..

  scenarios:
    needs: preflight
    if: needs.preflight.outputs.count != '0'
    name: scenarios (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # platforms-windows-wsl: hosted regression lanes; no macOS.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/harness/go.mod
          cache-dependency-path: |
            src/harness/go.sum
            tools/harness-gate/go.sum
      - name: Run the required scenarios
        env:
          RUN: ${{ needs.preflight.outputs.run }}
          TESTS: ${{ needs.preflight.outputs.tests }}
        run: |
          set -o pipefail
          mkdir -p artifacts/harness
          log=artifacts/harness/scenarios-${{ runner.os }}.txt
          GOWORK=off go -C src/harness test -tags scenario -count=1 -v -run "$RUN" ./... 2>&1 | tee "$log"
          if grep -q -- '--- SKIP' "$log"; then
            echo "a required scenario skipped"; exit 1
          fi
          for t in ${TESTS//,/ }; do
            grep -q -- "--- PASS: $t " "$log" || { echo "required scenario $t did not pass"; exit 1; }
          done
      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-scenarios-${{ matrix.os }}
          path: artifacts/harness/
          if-no-files-found: warn

  s18:
    # Stage 8.1: one job per in-scope variant of evidence/variants.md (M2-EN-2..8).
    if: inputs.stage == 'DH-S-18'
    name: s18 (${{ matrix.variant }})
    environment: dsh-m2-s18
    timeout-minutes: 180 # the 3 h variant limit (M2-EN-7); NODEFS-1 shards past it (M2-R-06)
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # check: the service preflight of variants.md's Preflight column; target: the
        # machine role or SSH variable it checks; scratch: share puts the scenarios'
        # temporary directories (FS-2's checkouts) on DSH_SCENARIO_FS1_SHARE. The
        # inputs each job needs are derived from its scenario tests (require --inputs).
        include:
          - variant: linux-wsl
            runner: '["self-hosted","linux","dsh-wsl"]'
            check: sandbox-local
            service: service:linux-sandbox-bwrap
          - variant: linux-wsl:two-account
            runner: '["self-hosted","linux","dsh-wsl"]'
            check: second-account
          - variant: linux-wsl:smb
            runner: '["self-hosted","linux","dsh-wsl"]'
            check: share
          - variant: linux-e2:bwrap
            runner: '["self-hosted","linux","dsh-e2-controller"]'
            check: sandbox-ssh
            service: service:linux-sandbox-bwrap
            target: bwrap
          - variant: linux-e2:landlock
            runner: '["self-hosted","linux","dsh-e2-controller"]'
            check: sandbox-ssh
            service: service:linux-landlock-only
            target: landlock
          - variant: linux-e2:landlock-abi1-4
            runner: '["self-hosted","linux","dsh-e2-controller"]'
            check: sandbox-ssh
            service: service:linux-landlock-only
            target: landlock-abi1-4
          - variant: linux-e2:unconfined
            runner: '["self-hosted","linux","dsh-e2-controller"]'
            check: sandbox-ssh
            service: service:linux-unconfined
            target: unconfined
          - variant: linux-e2:musl
            runner: '["self-hosted","linux","dsh-e2-controller"]'
            check: sandbox-ssh
            service: service:linux-landlock-only
            target: musl
          - variant: linux-e2:systemd
            runner: '["self-hosted","linux","dsh-e2-controller"]'
            check: systemd-ssh
            target: DSH_SCENARIO_EXEC10_SSH
          - variant: linux-e2:no-user-manager
            runner: '["self-hosted","linux","dsh-e2-controller"]'
            check: systemd-ssh
            target: DSH_SCENARIO_EXEC10_SSH_NOMANAGER
          - variant: windows-hosted
            runner: '"windows-latest"'
            check: windows-host
          - variant: windows-host
            runner: '["self-hosted","windows","dsh-windows-host"]'
            check: windows-host
          - variant: windows-host:two-account
            runner: '["self-hosted","windows","dsh-windows-host"]'
            check: second-account
          - variant: windows-host:smb
            runner: '["self-hosted","windows","dsh-windows-host"]'
            check: share
            scratch: share
          - variant: vm:linux-guest
            runner: '["self-hosted","linux","dsh-hypervisor"]'
            check: power-cut
          - variant: vm:windows-guest
            runner: '["self-hosted","linux","dsh-hypervisor"]'
            check: power-cut
    runs-on: ${{ fromJSON(matrix.runner) }}
    defaults:
      run:
        shell: bash
    env:
      # Machine identities and scenario inputs only (e2e-scenarios.md Phase 9 Secrets):
      # every input require --inputs derives for an in-scope variant, bound from the
      # environment's variables (TestWorkflowBindsEveryVariantInput).
      DSH_SCENARIO_REPORT: ${{ github.workspace }}/artifacts/harness/report.txt
      DSH_SCENARIO_CONTEXT2_EDITOR: ${{ vars.DSH_SCENARIO_CONTEXT2_EDITOR }}
      DSH_SCENARIO_CONTEXT2_LAYER: ${{ vars.DSH_SCENARIO_CONTEXT2_LAYER }}
      DSH_SCENARIO_CONTEXT2_MODEL: ${{ vars.DSH_SCENARIO_CONTEXT2_MODEL }}
      DSH_SCENARIO_CONTEXT2_ROUTE: ${{ vars.DSH_SCENARIO_CONTEXT2_ROUTE }}
      DSH_SCENARIO_EDITORS: ${{ vars.DSH_SCENARIO_EDITORS }}
      DSH_SCENARIO_EXEC1_CGROUPS: ${{ vars.DSH_SCENARIO_EXEC1_CGROUPS }}
      DSH_SCENARIO_EXEC1_NOCGROUP: ${{ vars.DSH_SCENARIO_EXEC1_NOCGROUP }}
      DSH_SCENARIO_EXEC1_RUN: ${{ vars.DSH_SCENARIO_EXEC1_RUN }}
      DSH_SCENARIO_EXEC1_START: ${{ vars.DSH_SCENARIO_EXEC1_START }}
      DSH_SCENARIO_EXEC10_CONNECT: ${{ vars.DSH_SCENARIO_EXEC10_CONNECT }}
      DSH_SCENARIO_EXEC10_RUN: ${{ vars.DSH_SCENARIO_EXEC10_RUN }}
      DSH_SCENARIO_EXEC10_SCOPE: ${{ vars.DSH_SCENARIO_EXEC10_SCOPE }}
      DSH_SCENARIO_EXEC10_SSH: ${{ vars.DSH_SCENARIO_EXEC10_SSH }}
      DSH_SCENARIO_EXEC10_SSH_NOMANAGER: ${{ vars.DSH_SCENARIO_EXEC10_SSH_NOMANAGER }}
      DSH_SCENARIO_EXEC10_START: ${{ vars.DSH_SCENARIO_EXEC10_START }}
      DSH_SCENARIO_EXEC10_STOP: ${{ vars.DSH_SCENARIO_EXEC10_STOP }}
      DSH_SCENARIO_FS_CHECKOUTS: ${{ vars.DSH_SCENARIO_FS_CHECKOUTS }}
      DSH_SCENARIO_FS1_DIRS: ${{ vars.DSH_SCENARIO_FS1_DIRS }}
      DSH_SCENARIO_FS1_LAYER: ${{ vars.DSH_SCENARIO_FS1_LAYER }}
      DSH_SCENARIO_FS1_MODEL: ${{ vars.DSH_SCENARIO_FS1_MODEL }}
      DSH_SCENARIO_FS1_ROUTE: ${{ vars.DSH_SCENARIO_FS1_ROUTE }}
      DSH_SCENARIO_FS1_SHARE: ${{ vars.DSH_SCENARIO_FS1_SHARE }}
      DSH_SCENARIO_FS2_CHILDREN: ${{ vars.DSH_SCENARIO_FS2_CHILDREN }}
      DSH_SCENARIO_FS2_LAYER: ${{ vars.DSH_SCENARIO_FS2_LAYER }}
      DSH_SCENARIO_FS2_SHARD: ${{ vars.DSH_SCENARIO_FS2_SHARD }}
      DSH_SCENARIO_FS2_TASKS: ${{ vars.DSH_SCENARIO_FS2_TASKS }}
      DSH_SCENARIO_HOST4_ARGS: ${{ vars.DSH_SCENARIO_HOST4_ARGS }}
      DSH_SCENARIO_HOST4_LAYER: ${{ vars.DSH_SCENARIO_HOST4_LAYER }}
      DSH_SCENARIO_HOST4_READY: ${{ vars.DSH_SCENARIO_HOST4_READY }}
      DSH_SCENARIO_NATIVESYSTEM1_SETUID: ${{ vars.DSH_SCENARIO_NATIVESYSTEM1_SETUID }}
      DSH_SCENARIO_NODEFS_LISTEN: ${{ vars.DSH_SCENARIO_NODEFS_LISTEN }}
      DSH_SCENARIO_NODEFS_POWEROFF: ${{ vars.DSH_SCENARIO_NODEFS_POWEROFF }}
      DSH_SCENARIO_NODEFS_POWERON: ${{ vars.DSH_SCENARIO_NODEFS_POWERON }}
      DSH_SCENARIO_NODEFS_READ: ${{ vars.DSH_SCENARIO_NODEFS_READ }}
      DSH_SCENARIO_NODEFS_START: ${{ vars.DSH_SCENARIO_NODEFS_START }}
      DSH_SCENARIO_REMOTE_CHANGE: ${{ vars.DSH_SCENARIO_REMOTE_CHANGE }}
      DSH_SCENARIO_REMOTE_DIRS: ${{ vars.DSH_SCENARIO_REMOTE_DIRS }}
      DSH_SCENARIO_REPOS: ${{ vars.DSH_SCENARIO_REPOS }}
      DSH_SCENARIO_SANDBOX1_LAYER: ${{ vars.DSH_SCENARIO_SANDBOX1_LAYER }}
      DSH_SCENARIO_SANDBOX1_MACHINES: ${{ vars.DSH_SCENARIO_SANDBOX1_MACHINES }}
      DSH_SCENARIO_SANDBOX1_MODEL: ${{ vars.DSH_SCENARIO_SANDBOX1_MODEL }}
      DSH_SCENARIO_SANDBOX1_ROUTE: ${{ vars.DSH_SCENARIO_SANDBOX1_ROUTE }}
      DSH_SCENARIO_SEARCH_BUDGET: ${{ vars.DSH_SCENARIO_SEARCH_BUDGET }}
      DSH_SCENARIO_STORAGE6_LIST: ${{ vars.DSH_SCENARIO_STORAGE6_LIST }}
      DSH_SCENARIO_STORAGE6_PUBLIC: ${{ vars.DSH_SCENARIO_STORAGE6_PUBLIC }}
      DSH_SCENARIO_STORAGE6_READ: ${{ vars.DSH_SCENARIO_STORAGE6_READ }}
      DSH_SCENARIO_STORAGE6_SEED: ${{ vars.DSH_SCENARIO_STORAGE6_SEED }}
      DSH_SCENARIO_STORAGE6_START: ${{ vars.DSH_SCENARIO_STORAGE6_START }}
      DSH_SCENARIO_STORAGE6_STATUS: ${{ vars.DSH_SCENARIO_STORAGE6_STATUS }}
      DSH_SCENARIO_STORAGE6_STOP: ${{ vars.DSH_SCENARIO_STORAGE6_STOP }}
      DSH_SCENARIO_STORAGE6_USER: ${{ vars.DSH_SCENARIO_STORAGE6_USER }}
      DSH_SCENARIO_VIEW5_LAYER: ${{ vars.DSH_SCENARIO_VIEW5_LAYER }}
      DSH_SCENARIO_VIEW5_MOVE: ${{ vars.DSH_SCENARIO_VIEW5_MOVE }}
      DSH_SCENARIO_VMS: ${{ vars.DSH_SCENARIO_VMS }}
      # The service preflight's own inputs (architecture.md provided services):
      # service:vm-power-cut and service:ack-recorder (runbook-power-cut.md step 2).
      DSH_S18_BASE_IMAGES: ${{ vars.DSH_S18_BASE_IMAGES }}
      DSH_S18_PROBE_CREATE: ${{ vars.DSH_S18_PROBE_CREATE }}
      DSH_S18_PROBE_DELETE: ${{ vars.DSH_S18_PROBE_DELETE }}
      DSH_S18_PROBE_ACK: ${{ vars.DSH_S18_PROBE_ACK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/harness/go.mod
          cache-dependency-path: |
            src/harness/go.sum
            tools/harness-gate/go.sum
      - name: Entry (M2-DEC-1)
        run: GOWORK=off go -C tools/harness-gate run . entry --root ../.. --story harness:DSH-M2
      - name: Derive the variant's required scenarios and inputs
        id: require
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          gate() { GOWORK=off go -C tools/harness-gate run . require --root ../.. --stage DH-S-18 --variant "$VARIANT" "$@"; }
          list="$(gate)"; inputs="$(gate --inputs)"
          echo "variant=$VARIANT DSH_REQUIRE_SCENARIOS=$list"
          echo "inputs: $inputs"
          missing=""
          for v in $inputs; do [ -n "${!v:-}" ] || missing="$missing $v"; done
          [ -z "$missing" ] || { echo "::error::not set in environment dsh-m2-s18:$missing"; exit 1; }
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: Load the lab SSH key
        if: contains(matrix.check, 'ssh')
        env:
          KEY: ${{ secrets.DSH_LAB_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DSH_LAB_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          printf '%s\n' "$KEY" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Service preflight (${{ matrix.check }})
        env:
          CHECK: ${{ matrix.check }}
          SERVICE: ${{ matrix.service }}
          TARGET: ${{ matrix.target }}
          SCRATCH: ${{ matrix.scratch }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$CHECK preflight failed: $*"; echo "record the variant 'not run ($CHECK preflight failed)'"; exit 1; }
          gate() { GOWORK=off go -C tools/harness-gate run . "$@"; }
          dsh="$RUNNER_TEMP/dsh"
          case "$CHECK" in
            sandbox-local)
              GOWORK=off go -C src/harness build -o "$dsh" ./cmd/dsh
              # An existing, empty home: an absent one cannot be seen read-only and
              # reports Partial (README "Guarded preflights" step 2).
              home="$(mktemp -d "$RUNNER_TEMP/s18-home.XXXXXX")"
              report="$("$dsh" --home "$home" sandbox status)" || true
              rm -rf "$home"
              printf '%s\n' "$report" | gate sandbox-preflight --service "$SERVICE" || fail "the sandbox report is not $SERVICE"
              ;;
            sandbox-ssh)
              alias=$(tr ';' '\n' <<<"$DSH_SCENARIO_SANDBOX1_MACHINES" | sed -n "s/^ *$TARGET *= *//p" | head -n1)
              [ -n "$alias" ] || fail "DSH_SCENARIO_SANDBOX1_MACHINES names no $TARGET machine"
              CGO_ENABLED=0 GOOS=linux GOWORK=off go -C src/harness build -o "$dsh" ./cmd/dsh
              dir=$(ssh -o BatchMode=yes "$alias" mktemp -d) || fail "ssh $alias failed"
              scp -q -o BatchMode=yes "$dsh" "$alias:$dir/dsh" || fail "scp to $alias failed"
              report=$(ssh -o BatchMode=yes "$alias" "mkdir -m 700 $dir/home && $dir/dsh --home $dir/home sandbox status") || true
              ssh -o BatchMode=yes "$alias" "rm -rf $dir" || true
              printf '%s\n' "$report" | gate sandbox-preflight --service "$SERVICE" || fail "$alias is not $SERVICE"
              ;;
            systemd-ssh)
              alias="${!TARGET}"
              state=$(ssh -o BatchMode=yes "$alias" 'systemctl --user is-system-running 2>&1' || true)
              cgroup=$(ssh -o BatchMode=yes "$alias" 'cat /proc/self/cgroup') || fail "ssh $alias failed"
              echo "$alias: systemctl --user: ${state:-<none>}; cgroup: $cgroup"
              ;;
            second-account)
              if [ "$RUNNER_OS" = Windows ]; then
                net user "$DSH_SCENARIO_STORAGE6_USER" >/dev/null || fail "no local account $DSH_SCENARIO_STORAGE6_USER"
              else
                id "$DSH_SCENARIO_STORAGE6_USER" || fail "no local account $DSH_SCENARIO_STORAGE6_USER"
                [ "$(id -u "$DSH_SCENARIO_STORAGE6_USER")" != "$(id -u)" ] || fail "the second account is the runner's own"
              fi
              ;;
            share)
              [ -d "$DSH_SCENARIO_FS1_SHARE" ] && [ -w "$DSH_SCENARIO_FS1_SHARE" ] || fail "share $DSH_SCENARIO_FS1_SHARE is not mounted and writable"
              # CHOKIDAR-2: a change made from the other machine or side must show here.
              IFS=';' read -ra remote <<<"$DSH_SCENARIO_REMOTE_DIRS"
              for d in "${remote[@]}"; do
                [ -n "${d// /}" ] || continue
                name="dsh-s18-probe-$$.txt"; marker="s18-$RANDOM$RANDOM"
                printf 'start\n' > "$d/$name" || fail "$d is not writable"
                cmd="${DSH_SCENARIO_REMOTE_CHANGE//\{dir\}/$d}"; cmd="${cmd//\{name\}/$name}"; cmd="${cmd//\{marker\}/$marker}"
                sh -c "$cmd" || { rm -f "$d/$name"; fail "DSH_SCENARIO_REMOTE_CHANGE failed on $d"; }
                seen=""; for _ in $(seq 1 20); do grep -qF "$marker" "$d/$name" && { seen=1; break; }; sleep 0.5; done
                rm -f "$d/$name"
                [ -n "$seen" ] || fail "the remote change to $d/$name was not seen here"
                echo "remote change seen: $d"
              done
              if [ "$SCRATCH" = share ]; then
                tmp="$DSH_SCENARIO_FS1_SHARE/s18-tmp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
                mkdir -p "$tmp" && [ -w "$tmp" ] || fail "cannot create $tmp on the share"
                [ "$RUNNER_OS" != Windows ] || tmp="$(cygpath -w "$tmp")"
                echo "SCRATCH_DIR=$tmp" >> "$GITHUB_ENV"
                echo "scenario temporary directories on the share: $tmp"
              fi
              ;;
            windows-host)
              GOWORK=off go -C src/harness build -o "$dsh.exe" ./cmd/dsh
              sha256sum "$dsh.exe"
              ;;
            power-cut)
              # service:vm-power-cut: a throw-away guest from an overlay is created,
              # powered off hard, restarted and deleted, the base images unchanged.
              # service:ack-recorder: a test acknowledgment from it is recorded and
              # read back. The scenario's own commands drive the probe guest.
              for v in DSH_S18_BASE_IMAGES DSH_S18_PROBE_CREATE DSH_S18_PROBE_DELETE DSH_S18_PROBE_ACK; do
                [ -n "${!v:-}" ] || fail "$v is not set in environment dsh-m2-s18"
              done
              IFS=';' read -ra images <<<"$DSH_S18_BASE_IMAGES"
              before="$(sha256sum "${images[@]}")" || fail "a base image is not readable"
              printf '%s\n' "$before"
              probe="dsh-s18-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RANDOM"
              sub() { local c="${1//\{vm\}/$probe}"; c="${c//\{probe\}/$probe}"; c="${c//\{addr\}/$DSH_SCENARIO_NODEFS_LISTEN}"; printf '%s' "${c//\{token\}/$token}"; }
              token="$probe-ack"
              trap 'sh -c "$(sub "$DSH_S18_PROBE_DELETE")" || echo "::warning::delete $probe by hand"' EXIT
              sh -c "$(sub "$DSH_S18_PROBE_CREATE")" || fail "the probe guest $probe was not created"
              sh -c "$(sub "$DSH_SCENARIO_NODEFS_POWEROFF")" || fail "the probe guest $probe was not powered off"
              sh -c "$(sub "$DSH_SCENARIO_NODEFS_POWERON")" || fail "the probe guest $probe did not restart"
              log="$RUNNER_TEMP/s18-ack.log"
              gate ack-probe --listen "$DSH_SCENARIO_NODEFS_LISTEN" --token "$token" --log "$log" --timeout 2m --send "$(sub "$DSH_S18_PROBE_ACK")" \
                || fail "no acknowledgment from $probe was recorded and read back"
              sh -c "$(sub "$DSH_S18_PROBE_DELETE")" || fail "the probe guest $probe was not deleted"
              trap - EXIT
              after="$(sha256sum "${images[@]}")"
              [ "$before" = "$after" ] || fail "a base image changed: $after"
              ;;
            *) fail "unknown check" ;;
          esac
      - name: Preflight
        id: preflight
        env:
          DSH_REQUIRE_SCENARIOS: ${{ steps.require.outputs.list }}
        run: GOWORK=off go -C tools/harness-gate run . preflight --root ../..
      - name: Run the variant's scenarios
        env:
          RUN: ${{ steps.preflight.outputs.run }}
          TESTS: ${{ steps.preflight.outputs.tests }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -o pipefail
          mkdir -p artifacts/harness
          log="artifacts/harness/s18-${VARIANT//:/-}.txt"
          if [ -n "${SCRATCH_DIR:-}" ]; then
            # t.TempDir (FS-2's checkouts) on the share; the go build stays local.
            export TMPDIR="$SCRATCH_DIR" TMP="$SCRATCH_DIR" TEMP="$SCRATCH_DIR" GOTMPDIR="$RUNNER_TEMP"
            trap 'rm -rf "$SCRATCH_DIR"' EXIT
          fi
          GOWORK=off go -C src/harness test -tags scenario -p 1 -count=1 -timeout 175m -v -run "$RUN" ./... 2>&1 | tee "$log"
          if grep -q -- '--- SKIP' "$log"; then
            echo "a required scenario skipped"; exit 1
          fi
          for t in ${TESTS//,/ }; do
            grep -q -- "--- PASS: $t " "$log" || { echo "required scenario $t did not pass"; exit 1; }
          done
      - name: Upload variant evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-s18-${{ strategy.job-index }}
