# Phase "tool pipeline, approvals and human commands" E2E (Stage 10.1: tool
# registry and prompt assembly; Stage 10.2: approvals and guarded pipeline).
#
#   e2e      the gate path: godog scenarios with -tags e2e on Linux, macOS and
#            Windows. TC-10a runs in-process; DH-T-TOOLS-14 compares against the
#            committed golden internal/tools/testdata/prompt.golden; TC-10b runs
#            on the embedded SQLite store in a test-kit temp home. No DSN, no
#            secrets, DSH_E2E_STORE_HOME unset.
#   compose  non-gating: the same tests against a dsh-home named volume through
#            tests/e2e/tool-pipeline-approvals-and-human-commands/docker-compose.yml.
name: e2e-tool-pipeline-approvals-and-human-commands

on:
  pull_request:
    paths:
      - src/harness/**
      - tests/e2e/tool-pipeline-approvals-and-human-commands/**
      - .github/workflows/e2e-tool-pipeline-approvals-and-human-commands.yml
  push:
    branches: [main]
    paths:
      - src/harness/**
      - tests/e2e/tool-pipeline-approvals-and-human-commands/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-tool-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/harness/go.mod
          cache-dependency-path: src/harness/go.sum
      - name: Tools, human and agent tests
        run: go -C src/harness test -race -shuffle=on -count=1 ./internal/tools/... ./internal/human/... ./internal/agent/...
      - name: Godog scenarios
        run: |
          set -o pipefail
          mkdir -p artifacts/e2e
          log=artifacts/e2e/tool-pipeline-${{ runner.os }}.txt
          go -C src/harness test -tags e2e -count=1 -v \
            -run '^TestE2E_tool_pipeline_approvals_and_human_commands_' \
            ./test/e2e/harness-DSH/ 2>&1 | tee "$log"
          if grep -q -- '--- SKIP' "$log"; then echo "a required scenario skipped"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-tool-pipeline-${{ matrix.os }}
          path: artifacts/e2e/
          if-no-files-found: warn

  compose:
    name: compose (ubuntu-latest, non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      COMPOSE_FILE: tests/e2e/tool-pipeline-approvals-and-human-commands/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Initialise the dsh-home volume
        run: docker compose run --rm dsh-home-init
      - name: Run the tests against the volume
        run: docker compose run --rm harness-store-tests
      - name: Tear down
        if: always()
        run: docker compose down -v
