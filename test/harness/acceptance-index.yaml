    - id: DH-E-STORAGE-1
      authored: DH-S-8
  DH-S-21:
    # Two processes on one home and one profile; guarded (impl.md step 21.13).
    - id: DH-E-BOOT-2
      authored: DH-S-6
  DH-S-22:
    # A launch that cannot serve fails loudly; one that can serves the UI's first
