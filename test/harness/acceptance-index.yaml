    - id: DH-E-BOOT-1
      authored: DH-S-6
  DH-S-23:
    # An image survives a crash mid-upload, a restart, a fork whose parent is
    # deleted and collection (impl.md DH-S-23); authored by Stage 8.2.
    - id: DH-E-STORAGE-2
      authored: DH-S-8
  DH-S-35:
    # A non-holder follows a session and hands its holder requests (impl.md step
    # 35.7); authored by Stage 7.3 (impl.md step 7.5), which builds the follow.
    - id: DH-E-STORE-5
      authored: DH-S-7
  DH-S-39:
    # All traffic through a TLS-intercepting proxy: the model, a fetched page and an
