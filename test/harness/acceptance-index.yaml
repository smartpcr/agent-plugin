# Acceptance index of the authored real-environment scenarios (DH-E-*).
#
# Keyed by the stage that EXECUTES a scenario (impl.md sec. 7.5 governs the
# placement); each entry lists the authored scenario IDs with the stage that
# authors their test. Read by tools/harness-gate:
#
#   - the scenario-index gate (keyless, every commit): every *_scenario_test.go
#     ID (//dsh:scenario directive) is listed here exactly once, and every ID
#     authored at or before built-through has its scenario test;
#   - "harness-gate require --stage DH-S-n" derives DSH_REQUIRE_SCENARIOS for the
#     acceptance run of that stage (.github/workflows/harness-scenarios.yml);
#   - "harness-gate preflight" fails that run when the secret is missing, this
#     index and the scenario tests disagree, or a required ID has no test.
#
# A stage adds its scenarios here in the same change that authors them, and
# raises built-through when it closes. Shape (strict; no other YAML is read):
#
#   built-through: DH-S-<n>
#   stages:
#     DH-S-<n>: []            # no scenario authored for this stage yet
#     DH-S-<n>:
#       - id: DH-E-<AREA>-<n>
#         authored: DH-S-<n>

built-through: DH-S-6

stages:
  DH-S-16:
    # The store's two-process and crash-recovery scenarios, run on scratch homes
    # (impl.md step 16.8); authored by Stage 7.2 (impl.md steps 7.2, 7.3).
    - id: DH-E-STORE-1
      authored: DH-S-7
    - id: DH-E-STORE-2
      authored: DH-S-7
  DH-S-17:
    # Its subjects (the model runtime, the replay helpers) exist from Phase 11;
    # the file is written by the DH-S-11 authoring step (impl.md DH-S-1 Scenarios).
    - id: DH-E-TOOLCHAIN-1
      authored: DH-S-11
    # A running harness following an edit to its profile patch (impl.md step 17.7);
    # authored with the validated reload of DH-S-6 (step 6.13).
    - id: DH-E-LOADER-1
      authored: DH-S-6
  DH-S-18:
    - id: DH-E-TOOLCHAIN-2
      authored: DH-S-1
    # The watcher, search and durable-replace scenarios of the leaf packages built in
    # DH-S-4 (impl.md steps 18.7, 18.8, 18.11).
    - id: DH-E-CHOKIDAR-1
      authored: DH-S-4
    - id: DH-E-CHOKIDAR-2
      authored: DH-S-4
    - id: DH-E-NODEFS-1
      authored: DH-S-4
    - id: DH-E-RIPGREP-1
      authored: DH-S-4
    - id: DH-E-RIPGREP-2
      authored: DH-S-4
    # Linux: a whole process tree is killed (impl.md step 18.3), and a host that
    # dies leaves a readable report on each OS (step 18.2); authored with the
    # test kit that closes circle C-1 (DH-S-6, step 6.17).
    - id: DH-E-EXEC-1
      authored: DH-S-6
    - id: DH-E-HOST-4
      authored: DH-S-6
  DH-S-21:
    # Two processes on one home and one profile; guarded (impl.md step 21.13).
    - id: DH-E-BOOT-2
      authored: DH-S-6
  DH-S-22:
    # A launch that cannot serve fails loudly; one that can serves the UI's first
    # page (impl.md step 22.3); authored in DH-S-6.
    - id: DH-E-BOOT-1
      authored: DH-S-6
  DH-S-39:
    # All traffic through a TLS-intercepting proxy: the model, a fetched page and an
    # MCP server over HTTP (impl.md step 39.15); authored in DH-S-6.
    - id: DH-E-UTIL-1
      authored: DH-S-6
